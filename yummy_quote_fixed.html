function userCard(handle,name,avatar,ownerId){return `<div class="user clickUser" onclick="viewUserProfile('${esc(handle||'').replace(/'/g,"\\'")}','${esc(name||handle||'').replace(/'/g,"\\'")}','${esc(avatar||DEFAULT_AVATAR).replace(/'/g,"\\'")}','${esc(ownerId||'').replace(/'/g,"\\'")}')"><img class="avatar" src="${esc(avatar||DEFAULT_AVATAR)}"><div><div class="name">${esc(name||handle||'')}</div><div class="handle">@${esc(handle||'')}</div></div></div>`}
function renderComments(p){if(!Array.isArray(p.comments))p.comments=[];return p.comments.map(c=>`<div class="comment"><div class="commentHead"><img class="commentAvatar" src="${esc(c.avatar||DEFAULT_AVATAR)}"><div><b>${esc(c.user||c.handle||'')}</b><span class="handle"> @${esc(c.handle||c.user||'')}</span></div></div><div style="margin:6px 0 0 40px;white-space:pre-wrap">${esc(c.text||'')}</div>${c.img?`<img class="commentImg" src="${esc(c.img)}">`:''}<div class="commentActions" style="margin-left:40px"><button onclick="likeComment('${String(p.id)}','${String(c.id)}')">${c.liked?'♥':'♡'} ${c.likes||0}</button><button onclick="replyComment('${String(p.id)}','${esc(c.handle||c.user||'')}')">↩ 返信</button><button onclick="repostComment('${String(p.id)}','${String(c.id)}')">🔁</button><button onclick="quoteComment('${String(p.id)}','${String(c.id)}')">💬</button><button onclick="saveComment('${String(p.id)}','${String(c.id)}')">🔖</button>${(c.handle===profile.handle||c.user===profile.name)?`<button class="danger" onclick="deleteComment('${String(p.id)}','${String(c.id)}')">🗑</button>`:''}</div></div>`).join('')}

function compressImageData(dataUrl,maxSide=1280,quality=.72){return new Promise((resolve,reject)=>{try{const im=new Image();im.onload=()=>{try{let w=im.naturalWidth||im.width,h=im.naturalHeight||im.height;if(!w||!h){resolve(dataUrl);return}const scale=Math.min(1,maxSide/Math.max(w,h));w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.drawImage(im,0,0,w,h);resolve(c.toDataURL('image/jpeg',quality))}catch(e){reject(e)}};im.onerror=()=>reject(new Error('画像を読み込めませんでした。'));im.src=dataUrl}catch(e){reject(e)}})}
function compressFileImage(file,maxSide=720,quality=.55){return new Promise((resolve,reject)=>{if(!file){reject(new Error('画像ファイルが選択されていません。'));return}const reader=new FileReader();reader.onerror=()=>reject(new Error('画像ファイルを読み込めませんでした。'));reader.onload=()=>{const dataUrl=reader.result;if(typeof dataUrl!=='string'||!dataUrl.startsWith('data:')){reject(new Error('画像データを取得できませんでした。'));return}const im=new Image();let finished=false;const fallback=()=>{if(finished)return;finished=true;resolve(dataUrl)};im.onload=()=>{if(finished)return;try{let w=im.naturalWidth||im.width,h=im.naturalHeight||im.height;if(!w||!h){fallback();return}const scale=Math.min(1,maxSide/Math.max(w,h));w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');if(!ctx){fallback();return}ctx.drawImage(im,0,0,w,h);let out='';try{out=c.toDataURL('image/jpeg',quality)}catch(e){fallback();return}if(!out||out.length<20){fallback();return}finished=true;resolve(out)}catch(e){fallback()}};im.onerror=()=>fallback();im.src=dataUrl;setTimeout(()=>fallback(),10000)};reader.readAsDataURL(file)})}
function persistPosts(){
  const put=(arr)=>{localStorage.setItem(key('posts'),JSON.stringify(arr));posts=arr;return true};
  try{return put(posts)}catch(e){}
  // 容量不足時は、まずコメント画像→古い投稿画像の順に削って再試行。
  try{
    let backup=posts.map(x=>({...x,comments:Array.isArray(x.comments)?x.comments.map(c=>({...c})):[]}));
    for(const p of backup){if(Array.isArray(p.comments)){for(const c of p.comments)c.img=''}}
    try{return put(backup)}catch(e){}
    for(let i=backup.length-1;i>=0;i--){
      if(backup[i].img){backup[i].img='';try{return put(backup)}catch(e){}}
    }
    // それでも入らない場合は、現在の投稿だけを優先して保存。
    const newest=backup.length?backup[0]:null;
    if(newest){
      const minimal={...newest,img:'',comments:[]};
      try{return put([minimal])}catch(e){}
    }
  }catch(e){}
  return false;
}
async function yummyReadImage(file){
  if(!file) throw new Error('画像ファイルが選択されていません。');
  // MIME typeを信用せず、実際にブラウザで画像として開けるか確認
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((resolve,reject)=>{
      const el=new Image();
      el.onload=()=>resolve(el);
      el.onerror=()=>reject(new Error('このファイルを画像として読み込めません。'));
      el.src=url;
    });
    const max=720;
    const scale=Math.min(1,max/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
    const w=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));
    const h=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const ctx=c.getContext('2d');
    if(!ctx) throw new Error('画像処理機能を利用できません。');
    ctx.drawImage(img,0,0,w,h);
    let data=c.toDataURL('image/jpeg',0.58);
    // canvas変換できない場合は元ファイルをDataURL化
    if(!data || data==='data:,') throw new Error('変換できません。');
    return data;
  }catch(err){
    return await new Promise((resolve,reject)=>{
      const r=new FileReader();
      r.onload=()=>resolve(r.result);
      r.onerror=()=>reject(err);
      r.readAsDataURL(file);
    });
  }finally{URL.revokeObjectURL(url)}
}

function readFileAsDataURL(file){
  return new Promise((resolve,reject)=>{
    if(!file){reject(new Error('画像ファイルがありません。'));return}
    const reader=new FileReader();
    reader.onload=()=>{
      const result=reader.result;
      if(typeof result==='string'&&result.length>20) resolve(result);
      else reject(new Error('画像データを取得できませんでした。'));
    };
    reader.onerror=()=>reject(new Error('画像ファイルを読み込めませんでした。'));
    reader.onabort=()=>reject(new Error('画像の読み込みが中断されました。'));
    reader.readAsDataURL(file);
  });
}
function addPost(){
  const textEl=$('postText');
  if(!textEl){alert('投稿画面を開き直してください。');return}
  const text=textEl.value.trim();
  const files=Array.isArray(selectedPostFiles)?selectedPostFiles.slice(0,4):[];
  if(!text&&!files.length){alert('文章か画像を入力してください。');return}
  const finish=(imgs)=>{
    const post={id:String(Date.now()+Math.random()),user:profile.handle||'user',name:profile.name||'ユーザー',avatar:profile.avatar||DEFAULT_AVATAR,ownerId:window.yummyUserId||'local-user',text,img:imgs[0]||'',imgs:imgs,likes:0,liked:false,saved:false,comments:[],syncStatus:'local'};
    posts.unshift(post);
    // 保存できない環境でも、投稿を画面上では成立させる
    // localStorageへの保存は試すが、失敗しても投稿を取り消さない
    try{localStorage.setItem(key('posts'),JSON.stringify(posts));}
    catch(e){
      console.warn('端末への永続保存はできませんでした。投稿はこの画面で保持します。',e);
      post.syncStatus='memory-only';
    }
    textEl.value='';selectedPostFiles=[];
    const box=$('previewList');if(box)box.innerHTML='';
    const fi=$('postFile');if(fi)fi.value='';
    closePost();current='home';
    ['home','search','book','notifications','dm','profile'].forEach(x=>$(x).classList.toggle('hidden',x!=='home'));
    render();
  };
  if(!files.length){finish([]);return}
  let remaining=files.length, imgs=[];
  files.forEach((file,i)=>{
    if(!file){remaining--;return}
    const reader=new FileReader();
    reader.onload=()=>{imgs[i]=String(reader.result||'');remaining--;if(remaining===0)finish(imgs.filter(Boolean));};
    reader.onerror=()=>{remaining--;imgs[i]='';if(remaining===0)finish(imgs.filter(Boolean));};
    reader.readAsDataURL(file);
  });
}

<script>
(function(){
  function following(){try{return JSON.parse(localStorage.getItem(key('following'))||'[]')}catch(e){return []}}
  function followers(){try{return JSON.parse(localStorage.getItem(key('followers'))||'[]')}catch(e){return []}}
  function knownUsers(){let a=[];posts.forEach(p=>{let h=String(p.user||'');if(h&&h!==profile.handle&&!a.some(x=>x.handle===h))a.push({handle:h,name:p.name||h,avatar:p.avatar||DEFAULT_AVATAR})});return a}
  function isFollowing(h){return following().includes(String(h||'').toLowerCase())}
  function isFollower(h){return followers().includes(String(h||'').toLowerCase())}
  function openConversation(h,n,a){activeDMUser={handle:h,name:n||h,avatar:a||DEFAULT_AVATAR};current='dm';['home','search','book','notifications','dm','profile'].forEach(x=>$(x).classList.toggle('hidden',x!=='dm'));$('dmList').classList.add('hidden');$('dmConversation').classList.remove('hidden');$('dmTitle').textContent=activeDMUser.name+'  @'+activeDMUser.handle;renderDM()}
  window.closeDMConversation=function(){activeDMUser=null;$('dmConversation').classList.add('hidden');$('dmList').classList.remove('hidden');renderDM()}
  window.renderDM=function(){let list=$('dmList');if(!list)return;let conversations={};dms.forEach(m=>{if(m.peer)conversations[m.peer]=m});if(activeDMUser){$('chat').innerHTML=dms.filter(m=>m.peer===activeDMUser.handle).map((m,i)=>'<div class="bubble '+(m.s==='me'?'me':'other')+'">'+esc(m.t)+'</div>').join('')||'<div class="empty">まだメッセージはありません。フォローしてから送信できます。</div>';$('chat').scrollTop=$('chat').scrollHeight;return}let peers=Object.keys(conversations);if(!peers.length){list.innerHTML='<div class="empty">DMを送った相手がここに表示されます。</div>';return}list.innerHTML=peers.map(h=>{let u=knownUsers().find(x=>x.handle===h)||{handle:h,name:h,avatar:DEFAULT_AVATAR};let m=conversations[h];return '<div class="dmListItem" onclick="openDMConversation(\''+esc(h).replace(/'/g,"\\'")+'\',\''+esc(u.name).replace(/'/g,"\\'")+'\',\''+esc(u.avatar).replace(/'/g,"\\'")+'\')"><img class="avatar" src="'+esc(u.avatar)+'"><div class="dmPreview"><b>'+esc(u.name)+'</b><div class="handle">@'+esc(h)+'</div><div class="last">'+esc(m.t)+'</div></div></div>'}).join('')}
  window.openDMConversation=openConversation;
  window.sendDM=function(){let el=$('dmInput'),v=el&&el.value.trim();if(!v||!activeDMUser)return;if(!isFollowing(activeDMUser.handle)){alert('DMを送るには、先にこの相手をフォローしてください。');return}dms.push({s:'me',t:v,id:String(Date.now()+Math.random()),peer:activeDMUser.handle,created_at:new Date().toISOString()});el.value='';save();renderDM()}
  window.viewUserProfile=function(handle,name,avatar){viewedProfile={handle:String(handle||''),name:String(name||handle||''),avatar:String(avatar||DEFAULT_AVATAR)};current='profile';['home','search','book','notifications','dm','profile'].forEach(x=>$(x).classList.toggle('hidden',x!=='profile'));renderProfile()}
  window.followViewedUser=function(){if(!viewedProfile||viewedProfile.handle===profile.handle)return;let arr=following(),h=viewedProfile.handle.toLowerCase();if(arr.includes(h))arr=arr.filter(x=>x!==h);else arr.push(h);localStorage.setItem(key('following'),JSON.stringify(arr));save();renderProfile()}
  window.showPeople=function(mode){peopleMode=mode;let box=$('profilePeople');if(!box)return;let users=knownUsers();let handles=mode==='following'?following():followers();users=users.filter(u=>handles.includes(u.handle.toLowerCase()));box.classList.remove('hidden');box.innerHTML='<div class="card"><button class="outline" onclick="hidePeople()">← プロフィール</button><b style="margin-left:10px">'+(mode==='following'?'フォロー中':'フォロワー')+'</b></div>'+(users.length?users.map(u=>'<div class="userRow"><img class="avatar" src="'+esc(u.avatar)+'"><div class="userInfo"><b>'+esc(u.name)+'</b><div class="handle">@'+esc(u.handle)+(isFollower(u.handle)?' <span class="profileState">フォローされています</span>':'')+'</div></div><button class="'+(isFollowing(u.handle)?'outline':'primary')+'" onclick="viewUserProfile(\''+esc(u.handle).replace(/'/g,"\\'")+'\',\''+esc(u.name).replace(/'/g,"\\'")+'\',\''+esc(u.avatar).replace(/'/g,"\\'")+'\')">'+(isFollowing(u.handle)?'フォロー中':'フォローする')+'</button></div>').join(''):'<div class="empty">該当するユーザーはいません。</div>')}
  window.hidePeople=function(){$('profilePeople').classList.add('hidden');renderProfile()}
  window.renderProfile=function(){let own=!viewedProfile||viewedProfile.handle===profile.handle;let v=own?{handle:profile.handle,name:profile.name,avatar:profile.avatar,bio:profile.bio,birth:profile.birth}:viewedProfile;let mine=isFollowing(v.handle),follower=isFollower(v.handle);$('profilePeople').classList.add('hidden');$('profileBox').innerHTML=(own?'<img class="profilehead" src="'+esc(profile.header)+'">':'')+'<div class="profile"><img class="bigavatar" src="'+esc(v.avatar||DEFAULT_AVATAR)+'"><div class="profilebuttons">'+(own?'<button class="primary" onclick="openPost()">＋ 投稿する</button><button class="outline" onclick="openEdit()">編集</button>':'<button class="primary" onclick="followViewedUser()">'+(mine?'フォロー中':'フォローする')+'</button><button class="outline" onclick="openConversation(\''+esc(v.handle).replace(/'/g,"\\'")+'\',\''+esc(v.name).replace(/'/g,"\\'")+'\',\''+esc(v.avatar).replace(/'/g,"\\'")+'\')">メッセージ</button>')+'</div><h2 style="margin-top:55px;margin-bottom:2px">'+esc(v.name||v.handle)+'</h2><div class="handle">@'+esc(v.handle)+(follower?' <span class="profileState">フォローされています</span>':'')+'</div>'+(own&&v.bio?'<div class="bio">'+esc(v.bio)+'</div>':'')+(own?'<div class="handle">🎂 '+(v.birth||'未設定')+'</div>':'')+'<div class="profileStats"><button onclick="showPeople(\'following\')"><b>'+following().length+'</b> フォロー中</button><button onclick="showPeople(\'followers\')"><b>'+followers().length+'</b> フォロワー</button></div></div>';$('profilePostsTitle').textContent=own?'自分の投稿':'投稿';feed(posts.filter(p=>p.user===v.handle),'myPosts')}
  let oldTab=window.tab;window.tab=function(t,b){activeDMUser=null;if($('dmConversation'))$('dmConversation').classList.add('hidden');if($('dmList'))$('dmList').classList.remove('hidden');oldTab(t,b)};
})();
</script>

<script>
/* yummy X風プロフィール・DM・フォロー機能 */
let activeDMHandle=null;
function graphKey(n){return key(n)}
function getFollowing(){try{return JSON.parse(localStorage.getItem(graphKey('following'))||'[]')}catch(e){return []}}
function setFollowing(a){localStorage.setItem(graphKey('following'),JSON.stringify(a))}
function getFollowers(){try{return JSON.parse(localStorage.getItem(graphKey('followers'))||'[]')}catch(e){return []}}
function setFollowers(a){localStorage.setItem(graphKey('followers'),JSON.stringify(a))}
function allKnownUsers(){
 const map={};
 if(profile.handle)map[profile.handle.toLowerCase()]={handle:profile.handle,name:profile.name||profile.handle,avatar:profile.avatar||DEFAULT_AVATAR};
 posts.forEach(p=>{let h=String(p.user||'').trim();if(h&&!map[h.toLowerCase()])map[h.toLowerCase()]={handle:h,name:p.name||h,avatar:p.avatar||DEFAULT_AVATAR}});
 return Object.values(map);
}
function ensureGraph(){
 const f=getFollowing(); const me=(profile.handle||'').toLowerCase();
 const followers=getFollowers();
 if(me&&!followers.some(x=>String(x).toLowerCase()===me))setFollowers(followers);
 return {following:f,followers:getFollowers()};
}
function isFollowingHandle(h){return getFollowing().some(x=>String(x).toLowerCase()===String(h).toLowerCase())}
function isFollowerOfMe(h){return getFollowers().some(x=>String(x).toLowerCase()===String(h).toLowerCase())}
function profileUserByHandle(h){return allKnownUsers().find(u=>u.handle.toLowerCase()===String(h).toLowerCase())||{handle:h,name:h,avatar:DEFAULT_AVATAR}}
function openDMWith(handle){
 activeDMHandle=String(handle||''); current='dm';
 ['home','search','book','notifications','dm','profile'].forEach(x=>$(x).classList.toggle('hidden',x!=='dm'));
 document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
 renderDM(); setTimeout(()=>{$('dmInput')&&$('dmInput').focus()},50);
}
function renderDM(){
 const target=activeDMHandle;
 const title=target?profileUserByHandle(target):null;
 const head=document.querySelector('#dm > .card');
 if(head)head.innerHTML=target?`<button class="outline" onclick="activeDMHandle=null;renderDM()">← DM一覧</button><div style="margin-top:10px"><b>${esc(title.name)}</b> <span class="handle">@${esc(title.handle)}</span></div>`:'<b>✉️ ダイレクトメッセージ</b>';
 const chat=$('chat'),bar=document.querySelector('#dm .dmbar');
 if(!target){
  chat.innerHTML=dms.length?dms.map(m=>`<div class="card" style="cursor:pointer" onclick="openDMWith('${esc(m.handle||'')}')"><div class="user"><img class="avatar" src="${esc(m.avatar||DEFAULT_AVATAR)}"><div><b>${esc(m.name||m.handle||'ユーザー')}</b><div class="handle">@${esc(m.handle||'')}</div><div>${esc(m.t||'')}</div></div></div></div>`).join(''):'<div class="empty">まだDMはありません。相手のプロフィールからメッセージを送ってみよう。</div>';
  if(bar)bar.classList.add('hidden'); return;
 }
 if(bar)bar.classList.remove('hidden');
 const messages=dms.filter(m=>String(m.handle||'').toLowerCase()===target.toLowerCase());
 chat.innerHTML=messages.map((m)=>`<div class="bubble ${m.s==='me'?'me':'other'}">${esc(m.t)}${m.s==='me'?`<div style="margin-top:5px;text-align:right"><button onclick="deleteDMById('${esc(m.id||'')}')" style="border:0;background:transparent;color:#b8c0c8;font-size:11px">🗑</button></div>`:''}</div>`).join('')||'<div class="empty">この相手とのDMはまだありません。</div>';
 chat.scrollTop=chat.scrollHeight;
}
function deleteDMById(id){dms=dms.filter(m=>String(m.id)!==String(id));save();renderDM()}
function sendDM(){
 const input=$('dmInput'),v=input&&input.value.trim(); if(!v)return;
 if(!activeDMHandle){alert('先にDMする相手を選んでください。');return}
 const u=profileUserByHandle(activeDMHandle);
 dms.push({s:'me',t:v,id:String(Date.now()+Math.random()),handle:u.handle,name:u.name,avatar:u.avatar});
 input.value=''; save(); renderDM();
}
function followViewedUser(){
 if(!viewedProfile||!viewedProfile.handle||viewedProfile.handle.toLowerCase()===String(profile.handle).toLowerCase())return;
 const h=viewedProfile.handle.toLowerCase(), arr=getFollowing();
 if(arr.some(x=>String(x).toLowerCase()===h))setFollowing(arr.filter(x=>String(x).toLowerCase()!==h));
 else {arr.push(viewedProfile.handle);setFollowing(arr)}
 renderProfile();
}
function showRelationList(type){
 const users=allKnownUsers().filter(u=>u.handle.toLowerCase()!==String(profile.handle).toLowerCase());
 const arr=type==='followers'?getFollowers():getFollowing();
 const filtered=users.filter(u=>arr.some(h=>String(h).toLowerCase()===u.handle.toLowerCase()));
 const modal=document.createElement('div');modal.className='modal';modal.id='relationModal';
 modal.innerHTML=`<div class="box"><div class="modalhead"><b>${type==='followers'?'フォロワー':'フォロー中'}</b><button class="close" onclick="document.getElementById('relationModal').remove()">✕</button></div>${filtered.length?filtered.map(u=>`<div class="user" style="padding:12px 0;border-bottom:1px solid #2f3336;cursor:pointer" onclick="document.getElementById('relationModal').remove();viewUserProfile('${esc(u.handle)}','${esc(u.name)}','${esc(u.avatar)}')"><img class="avatar" src="${esc(u.avatar)}"><div><b>${esc(u.name)}</b><div class="handle">@${esc(u.handle)}</div>${isFollowerOfMe(u.handle)?'<span class="handle">フォローされています</span>':''}</div></div>`).join(''):'<div class="empty">まだいません。</div>'}</div>`;
 document.body.appendChild(modal);
}
function viewUserProfile(handle,name,avatar){
 const h=String(handle||''); viewedProfile={handle:h,name:String(name||h),avatar:String(avatar||DEFAULT_AVATAR)}; current='profile';
 ['home','search','book','notifications','dm','profile'].forEach(x=>$(x).classList.toggle('hidden',x!=='profile'));
 document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active')); renderProfile();
}
function renderProfile(){
 const own=!viewedProfile||String(viewedProfile.handle).toLowerCase()===String(profile.handle).toLowerCase();
 const v=own?{handle:profile.handle,name:profile.name,avatar:profile.avatar,bio:profile.bio,birth:profile.birth}:viewedProfile;
 const shownPosts=posts.filter(p=>String(p.user||'').toLowerCase()===String(v.handle||'').toLowerCase());
 const following=getFollowing(), followers=getFollowers();
 const followingCount=own?following.length:0, followerCount=own?followers.length:(isFollowerOfMe(v.handle)?1:0);
 const followed=isFollowingHandle(v.handle), followedMe=isFollowerOfMe(v.handle);
 $('profileBox').innerHTML=`${own?`<img class="profilehead" src="${esc(profile.header)}">`:''}<div class="profile"><img class="bigavatar" src="${esc(v.avatar||DEFAULT_AVATAR)}"><div class="profilebuttons">${own?`<button class="primary" onclick="openPost()">＋ 投稿する</button><button class="outline" onclick="openEdit()">編集</button>`:`<button class="outline" onclick="openDMWith('${esc(v.handle)}')">メッセージ</button><button class="primary" onclick="followViewedUser()">${followed?'フォロー中':'フォロー'}</button>`}</div><h2 style="margin-top:55px;margin-bottom:2px">${esc(v.name||v.handle)}</h2><div class="handle">@${esc(v.handle)} ${followedMe?'<span style="background:#eff3f4;color:#536471;padding:3px 7px;border-radius:5px">フォローされています</span>':''}</div>${own&&v.bio?`<div class="bio">${esc(v.bio)}</div>`:''}${own?`<div class="handle">🎂 ${esc(v.birth||'未設定')}</div>`:''}<div style="display:flex;gap:20px;margin-top:16px"><button class="outline" onclick="showRelationList('following')"><b>${followingCount}</b> フォロー中</button><button class="outline" onclick="showRelationList('followers')"><b>${followerCount}</b> フォロワー</button></div></div>`;
 $('myPosts').previousElementSibling.innerHTML='<b>'+(own?'自分の投稿':'投稿')+'</b>'; feed(shownPosts,'myPosts');
}
</script>
